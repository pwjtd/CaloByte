<main class="mx-auto max-w-3xl space-y-8 p-6">
  <h1 class="text-2xl font-bold">CaloByte</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 grid-cols-2">
    <label class="flex flex-col text-sm">Name
      <input formControlName="name" class="rounded border p-2" />
    </label>
    <label class="flex flex-col text-sm">Surname
      <input formControlName="surname" class="rounded border p-2" />
    </label>
    <label class="flex flex-col text-sm col-span-2">Email
      <input type="email" formControlName="email" class="rounded border p-2" />
    </label>
    <label class="flex flex-col text-sm col-span-2">Birth Date
      <input type="date" formControlName="birth_date" class="rounded border p-2" />
    </label>
    <label class="flex flex-col text-sm">Weight (kg)
      <input type="number" step="0.1" formControlName="weight_kg" class="rounded border p-2" />
    </label>
    <label class="flex flex-col text-sm">Height (cm)
      <input type="number" step="0.1" formControlName="height_cm" class="rounded border p-2" />
    </label>
    <label class="flex flex-col text-sm">Activity Level
      <select formControlName="activity" class="rounded border p-2 h-10">
        <option value="sedentary">Sedentary</option>
        <option value="light">Light</option>
        <option value="moderate">Moderate</option>
        <option value="active">Active</option>
        <option value="very_active">Very Active</option>
      </select>
    </label>
    <label class="flex flex-col text-sm">Sex
      <select formControlName="sex" class="rounded border p-2 h-10">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </label>

    <button type="submit" [disabled]="form.invalid"
            class="rounded bg-blue-600 p-2 text-white disabled:opacity-50 col-span-2">
      Add User
    </button>
  </form>

  @if (error()) {
    <p class="text-red-600">{{ error() }}</p>
  }

  <table class="w-full text-left text-sm">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Weight</th><th>Height</th><th>BMI</th></tr>
    </thead>
    <tbody>
      @for (u of users(); track u.id) {
        <tr>
          <td>{{ u.name }} {{ u.surname }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.weight_kg }} kg</td>
          <td>{{ u.height_cm }} cm</td>
          <td>{{ u.bmi }}</td>
        </tr>
      } @empty {
        <tr><td colspan="5" class="text-gray-500">No users found</td></tr>
      }
    </tbody>
  </table>
</main>

<router-outlet />
