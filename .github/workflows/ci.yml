name: ci
on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests with coverage (pytest)
        run: |
          pytest --cov=app --cov-report=term-missing
          echo "## Backend coverage" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests with coverage (vitest)
        run: npx ng test --watch=false --coverage
      - name: Coverage summary
        if: always()
        run: |
          echo "## Frontend coverage" >> $GITHUB_STEP_SUMMARY
          node -e "const t=require('./coverage/frontend/coverage-summary.json').total;
          console.log('| Metric | % |\n|---|---|');
          for (const k of ['statements','branches','functions','lines']) console.log('| '+k+' | '+t[k].pct+'% |')" >> $GITHUB_STEP_SUMMARY
